# Ambiente local completo (simula "teste/staging"): banco, dependência externa e a imagem da aplicação.
# Segredos vêm do arquivo .env (não versionado) — ver .env.example. Nada sensível é gravado na imagem.
name: portal-tarefas

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?defina MSSQL_SA_PASSWORD no .env}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  calendario:
    image: node:22.23.4-alpine@sha256:0e1754758c2df4cfa3e68d59e2e1b7374bb7fd9ea6328eaaacf15cc934af8202
    command: ["node", "/srv/dependencia-calendario.js"]
    volumes:
      - ./scripts/dependencia-calendario.js:/srv/dependencia-calendario.js:ro

  api:
    image: portal-tarefas:${APP_VERSION:-dev}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        APP_COMMIT: ${APP_COMMIT:-local}
    depends_on:
      sql: { condition: service_healthy }
      calendario: { condition: service_started }
    expose: ["8080"]                   # sem porta publicada: o acesso externo passa pelo proxy TLS
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__PortalTarefas: "Server=sql,1433;Database=PortalTarefas;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      SeedUsuarios__SenhaInicial: ${SEED_SENHA:-}
      Banco__AplicarMigrations: "true"
      Dependencias__Calendario__Url: http://calendario:5099/
      DataProtection__Caminho: /chaves
    read_only: true                    # sistema de arquivos somente leitura
    tmpfs: [/tmp]
    volumes:
      - chaves-dp:/chaves              # chaves do Data Protection sobrevivem à recriação do contêiner
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Proxy reverso que termina o TLS (como um ingress/load balancer faria em produção).
  # A API recebe X-Forwarded-Proto=https (ASPNETCORE_FORWARDEDHEADERS_ENABLED) e emite cookies Secure.
  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    command: ["caddy", "reverse-proxy", "--from", "https://localhost:8443", "--to", "api:8080", "--internal-certs"]
    ports:
      - "8443:8443"
    depends_on:
      api: { condition: service_healthy }

volumes:
  chaves-dp:
