# CI/CD do Portal de Tarefas (pasta PortalTarefas/). Etapas espelhadas em PortalTarefas/scripts/ci-local.sh.
name: portal-tarefas

on:
  pull_request:
    paths: ["PortalTarefas/**", ".github/workflows/portal-tarefas.yml"]
  push:
    branches: [main]
    paths: ["PortalTarefas/**", ".github/workflows/portal-tarefas.yml"]
  workflow_dispatch:

permissions:
  contents: read            # mínimo por padrão; jobs que publicam pedem mais

concurrency:
  group: portal-tarefas-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: PortalTarefas

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      sql:                                   # banco descartável só para os testes de integração
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_SA_PASSWORD }}
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: PortalTarefas/global.json   # versão de SDK explícita e reproduzível
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore -p:OpenApiGenerateDocuments=false
      - name: dotnet test
        env:
          PORTAL_SQL_TESTES: "Server=localhost,1433;User Id=sa;Password=${{ secrets.CI_SQL_SA_PASSWORD }};TrustServerCertificate=True"
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=testes.trx" --results-directory TestResults
      - name: Dependências .NET vulneráveis (bloqueia em High/Critical)
        run: |
          dotnet list package --vulnerable --include-transitive | tee vulneraveis.txt
          ! grep -qE "\b(High|Critical)\b" vulneraveis.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: testes-dotnet, path: PortalTarefas/TestResults }

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: PortalTarefas/src/PortalTarefas.Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: PortalTarefas/src/PortalTarefas.Frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npx vitest run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: PortalTarefas/src/PortalTarefas.Frontend/dist }

  imagem:
    needs: [backend, frontend]               # só roda se TODOS os testes passaram
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write                        # publicar no GHCR com o GITHUB_TOKEN efêmero (sem credencial longa)
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=ghcr.io/${GITHUB_REPOSITORY,,}/portal-tarefas:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build da imagem (tag = commit)
        run: |
          docker build --build-arg APP_VERSION="1.0.${{ github.run_number }}+${GITHUB_SHA::7}" \
                       --build-arg APP_COMMIT="${GITHUB_SHA}" -t "${{ steps.meta.outputs.tag }}" .
      - name: Smoke test do contêiner
        run: |
          docker run -d --name smoke -p 8080:8080 -e ConnectionStrings__PortalTarefas=Server=nao-usado \
            -e Dependencias__Calendario__Url=http://nao-usado/ "${{ steps.meta.outputs.tag }}"
          for i in $(seq 1 30); do curl -sf localhost:8080/health/live && break; sleep 1; done
          curl -sf localhost:8080/api/versao
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.meta.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Varredura de vulnerabilidades da imagem (falha em Critical corrigível)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: PortalTarefas/sbom.spdx.json }
      - name: Publicar no GHCR (somente main)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "${{ steps.meta.outputs.tag }}"

  staging:
    if: github.ref == 'refs/heads/main'
    needs: imagem
    runs-on: ubuntu-24.04
    environment: staging                      # segredos do ambiente + regras de proteção no GitHub
    steps:
      - uses: actions/checkout@v4
      - name: Implantar em ambiente de teste efêmero (compose) e verificar
        env:
          MSSQL_SA_PASSWORD: ${{ secrets.STAGING_SQL_SA_PASSWORD }}
          SEED_SENHA: ${{ secrets.STAGING_SEED_SENHA }}
        run: |
          docker pull "${{ needs.imagem.outputs.tag }}"
          docker tag "${{ needs.imagem.outputs.tag }}" portal-tarefas:staging
          APP_VERSION=staging docker compose up -d --no-build
          for i in $(seq 1 60); do curl -sf localhost:8080/health/ready && break; sleep 2; done
          curl -sf localhost:8080/health/ready && curl -sf localhost:8080/api/versao
          echo "versão implantada: ${{ needs.imagem.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"

  producao:
    needs: [imagem, staging]
    runs-on: ubuntu-24.04
    environment: production                   # exige aprovação manual (required reviewers)
    steps:
      - name: Promover a MESMA imagem aprovada em staging
        run: |
          echo "Promover ${{ needs.imagem.outputs.tag }} (sem rebuild)."
          echo "Rollback: reimplantar a tag anterior registrada no resumo do run anterior."
